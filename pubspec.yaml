name: warcraft_flutter_components
description: Production-ready fantasy Flutter UI kit with 18 accessible components, faction themes, bundled assets, and responsive interactions.
homepage: https://github.com/AllinGaming/warcraft_flutter_components
repository: https://github.com/AllinGaming/warcraft_flutter_components
issue_tracker: https://github.com/AllinGaming/warcraft_flutter_components/issues
version: 0.5.0
topics:
  - flutter
  - ui
  - widgets
  - design-system
  - warcraft

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/warcraft/
    - assets/warcraft/tabs/
    - assets/warcraft/svg/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cinzel-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
